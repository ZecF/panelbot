<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PteroWA Panel — Termux Web & 200MB Uploader</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans">

  <!-- Header -->
  <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-10">
    <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <span class="h-3 w-3 rounded-full bg-emerald-400 animate-pulse"></span>
        <h1 class="text-lg font-bold tracking-wide text-white">PteroWA <span class="text-xs font-normal bg-emerald-500/20 text-emerald-300 px-2 py-0.5 rounded-full border border-emerald-500/30">Termux Edition</span></h1>
      </div>
      <div class="flex flex-wrap items-center gap-2 text-xs text-slate-300">
        <span class="bg-slate-800 px-2.5 py-1 rounded border border-slate-700">Node.js: <strong id="spec-node" class="text-emerald-400">v20.x</strong></span>
        <span class="bg-slate-800 px-2.5 py-1 rounded border border-slate-700">FFmpeg: <strong class="text-emerald-400">Installed</strong></span>
        <span class="bg-slate-800 px-2.5 py-1 rounded border border-slate-700">RAM: <strong id="spec-ram" class="text-cyan-400">Loading...</strong></span>
      </div>
    </div>
  </header>

  <!-- Main Grid -->
  <main class="max-w-7xl mx-auto p-4 grid grid-cols-1 lg:grid-cols-3 gap-6">

    <!-- Kolom Kiri: Terminal Interaktif ala Termux (2 Kolom) -->
    <section class="lg:col-span-2 flex flex-col bg-slate-900 border border-slate-800 rounded-xl overflow-hidden shadow-xl">
      <div class="bg-slate-800/70 px-4 py-2.5 flex items-center justify-between border-b border-slate-700">
        <div class="flex items-center gap-2">
          <span class="text-xs font-mono text-emerald-400">bash@workspace:~#</span>
        </div>
        <div class="flex gap-2">
          <button onclick="sendSigInt()" class="bg-amber-600 hover:bg-amber-500 text-white text-xs px-2.5 py-1 rounded font-medium transition">Stop Bot (CTRL+C)</button>
          <button onclick="restartTerm()" class="bg-rose-600 hover:bg-rose-500 text-white text-xs px-2.5 py-1 rounded font-medium transition">Restart Shell</button>
        </div>
      </div>

      <!-- Layar Xterm.js -->
      <div id="terminal-container" class="w-full h-[380px] bg-black p-2"></div>

      <!-- Baris Tombol Cepat ala Termux Android -->
      <div class="bg-slate-950 border-t border-slate-800 p-2 flex flex-wrap gap-1.5">
        <button onclick="quickCmd('ls -la\n')" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-mono px-2.5 py-1.5 rounded border border-slate-700">ls -la</button>
        <button onclick="quickCmd('npm install\n')" class="bg-slate-800 hover:bg-slate-700 text-emerald-300 text-xs font-mono px-2.5 py-1.5 rounded border border-slate-700">npm install</button>
        <button onclick="quickCmd('node index.js\n')" class="bg-emerald-700/40 hover:bg-emerald-600/50 text-emerald-200 text-xs font-mono px-2.5 py-1.5 rounded border border-emerald-600/50">node index.js</button>
        <button onclick="quickCmd('ffmpeg -version\n')" class="bg-slate-800 hover:bg-slate-700 text-cyan-300 text-xs font-mono px-2.5 py-1.5 rounded border border-slate-700">ffmpeg -v</button>
        <button onclick="quickCmd('rm -rf session\n')" class="bg-slate-800 hover:bg-slate-700 text-rose-300 text-xs font-mono px-2.5 py-1.5 rounded border border-slate-700">Hapus Session</button>
        <button onclick="term.clear()" class="bg-slate-800 hover:bg-slate-700 text-slate-400 text-xs font-mono px-2.5 py-1.5 rounded border border-slate-700">Clear</button>
      </div>

      <!-- Input Ketik Manual (Nyaman untuk HP) -->
      <form onsubmit="submitCommand(event)" class="flex border-t border-slate-800 bg-slate-900">
        <span class="px-3 py-2.5 text-emerald-400 font-mono text-sm select-none">$</span>
        <input id="cmd-input" type="text" placeholder="Ketik perintah Termux di sini (misal: npm i / node index.js / git clone ...)" class="w-full bg-transparent text-sm font-mono text-white focus:outline-none py-2.5 pr-3" autocomplete="off" />
        <button type="submit" class="bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-semibold px-5 transition">Kirim</button>
      </form>
    </section>

    <!-- Kolom Kanan: Upload Script (Max 200MB) & File Manager -->
    <section class="flex flex-col gap-6">

      <!-- Card Upload Script 200MB -->
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 shadow-xl">
        <h2 class="text-sm font-semibold text-white mb-1">Upload Script Bot (Maks 200MB)</h2>
        <p class="text-xs text-slate-400 mb-3">Upload file <code class="text-emerald-400">.zip</code> untuk langsung diekstrak otomatis ke folder kerja.</p>

        <label class="flex flex-col items-center justify-center border-2 border-dashed border-slate-700 hover:border-emerald-500 rounded-lg p-5 cursor-pointer transition bg-slate-950/50">
          <span class="text-xs text-slate-300 font-medium text-center" id="file-label">Klik untuk pilih file (.zip / .js / .json)</span>
          <span class="text-[11px] text-slate-500 mt-1">Batas ukuran maksimal: 200 MB</span>
          <input type="file" id="script-file" class="hidden" onchange="updateFileName()" />
        </label>

        <!-- Progress Bar -->
        <div id="progress-wrapper" class="hidden mt-3">
          <div class="flex justify-between text-xs mb-1">
            <span id="progress-status" class="text-emerald-400">Mengupload...</span>
            <span id="progress-percent">0%</span>
          </div>
          <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden">
            <div id="progress-bar" class="bg-emerald-500 h-full transition-all duration-150" style="width: 0%"></div>
          </div>
        </div>

        <button onclick="uploadScript()" class="mt-3 w-full bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold py-2.5 rounded-lg transition">
          Upload & Ekstrak ke Server
        </button>
      </div>

      <!-- Card File Manager Workspace -->
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 shadow-xl flex-1 flex flex-col">
        <div class="flex items-center justify-between mb-3">
          <h2 class="text-sm font-semibold text-white">Isi Folder <code class="text-emerald-400">/workspace</code></h2>
          <button onclick="loadFiles()" class="text-xs text-cyan-400 hover:underline">Refresh</button>
        </div>
        <ul id="file-list" class="space-y-1.5 text-xs font-mono overflow-y-auto max-h-60 pr-1">
          <li class="text-slate-500">Memuat daftar file...</li>
        </ul>
      </div>

    </section>
  </main>

  <script>
    const socket = io();
    const term = new Terminal({
      cursorBlink: true,
      fontSize: 13,
      convertEol: true,
      fontFamily: 'monospace',
      theme: { background: '#000000', foreground: '#e2e8f0' }
    });
    const fitAddon = new FitAddon.FitAddon();
    term.loadAddon(fitAddon);
    term.open(document.getElementById('terminal-container'));
    fitAddon.fit();

    window.addEventListener('resize', () => fitAddon.fit());

    // Ketik langsung di layar Xterm
    term.onData((data) => {
      socket.emit('term-input', data);
    });

    // Tampilkan output dari server ke Xterm
    socket.on('term-output', (data) => {
      term.write(data);
    });

    // Kirim dari input teks bawah
    function submitCommand(e) {
      e.preventDefault();
      const input = document.getElementById('cmd-input');
      if (input.value.trim() !== '') {
        socket.emit('term-input', input.value + '\n');
        input.value = '';
      }
    }

    function quickCmd(cmd) {
      socket.emit('term-input', cmd);
      loadFiles();
    }

    function sendSigInt() {
      socket.emit('term-sigint');
    }

    function restartTerm() {
      socket.emit('term-restart');
    }

    function updateFileName() {
      const fileInput = document.getElementById('script-file');
      const label = document.getElementById('file-label');
      if (fileInput.files.length) {
        const f = fileInput.files[0];
        const sizeMB = (f.size / (1024 * 1024)).toFixed(2);
        label.textContent = `${f.name} (${sizeMB} MB)`;
      }
    }

    function uploadScript() {
      const fileInput = document.getElementById('script-file');
      if (!fileInput.files.length) return alert('Pilih file script terlebih dahulu!');

      const file = fileInput.files[0];
      if (file.size > 200 * 1024 * 1024) {
        return alert('Ukuran file melebihi batas maksimal 200MB!');
      }

      const formData = new FormData();
      formData.append('scriptFile', file);

      const xhr = new XMLHttpRequest();
      const wrap = document.getElementById('progress-wrapper');
      const bar = document.getElementById('progress-bar');
      const pct = document.getElementById('progress-percent');
      const status = document.getElementById('progress-status');

      wrap.classList.remove('hidden');

      xhr.upload.onprogress = (e) => {
        if (e.lengthComputable) {
          const percent = Math.round((e.loaded / e.total) * 100);
          bar.style.width = percent + '%';
          pct.textContent = percent + '%';
        }
      };

      xhr.onload = () => {
        const res = JSON.parse(xhr.responseText || '{}');
        if (xhr.status === 200) {
          status.textContent = res.message;
          loadFiles();
        } else {
          status.textContent = res.error || 'Upload gagal';
        }
      };

      xhr.open('POST', '/api/upload', true);
      xhr.send(formData);
    }

    async function loadFiles() {
      const res = await fetch('/api/files');
      const files = await res.json();
      const list = document.getElementById('file-list');
      if (!files.length) {
        list.innerHTML = '<li class="text-slate-500">Folder /workspace masih kosong.</li>';
        return;
      }
      list.innerHTML = files.map(f => `
        <li class="flex justify-between items-center bg-slate-950 px-2.5 py-1.5 rounded border border-slate-800">
          <span class="${f.isDirectory ? 'text-amber-400 font-semibold' : 'text-slate-200'}">
            ${f.isDirectory ? '📁 ' : '📄 '}${f.name}
          </span>
          <span class="text-slate-500 text-[11px]">${f.size}</span>
        </li>
      `).join('');
    }

    async function loadSpecs() {
      const res = await fetch('/api/specs');
      const data = await res.json();
      document.getElementById('spec-node').textContent = data.node;
      document.getElementById('spec-ram').textContent = data.ram;
    }

    loadFiles();
    loadSpecs();
    setInterval(loadFiles, 5000);
  </script>
</body>
</html>
